name: publish

on:
  push:
    tags: ['v*']

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production   # must match the environment on the nuget.org Trusted Publishing policy
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Tag v1.2.3 publishes package version 1.2.3
      - run: dotnet pack src/XperienceCommunity.UsageApplications/XperienceCommunity.UsageApplications.csproj -c Release -o out -p:Version=${GITHUB_REF_NAME#v}

      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org profile name, not email

      - run: dotnet nuget push out/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
